<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Shankar Tiwari</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #1d1f21;
            --card: #282a2e;
            --text: #c5c8c6;
            --dim: #7c7f84;
            --accent: #81a2be;
            --border: #373b41;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            text-align: center;
            max-width: 420px;
            padding: 48px 32px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .code {
            font-size: 5em;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        h1 {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 12px;
        }
        p {
            color: var(--dim);
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        a {
            display: inline-block;
            padding: 8px 24px;
            background: var(--bg);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 500;
            transition: border-color 0.2s ease;
        }
        a:hover {
            border-color: var(--dim);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/resume/">Back to resume</a>
    </div>
</body>
</html>
